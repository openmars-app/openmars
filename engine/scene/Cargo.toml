[package]
name = "openmars-scene"
version = "0.1.0"
edition = "2024"
publish = false

[features]
export-types = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
ts-rs = { version = "=10.1.0", optional = true, features = ["no-serde-warnings"] }

[[bin]]
name = "export-types"
path = "src/bin/export.rs"
required-features = ["export-types"]
