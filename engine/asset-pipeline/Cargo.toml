[package]
name = "openmars-engine-assets"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
exr = { version = "=1.74.0", default-features = false }
half = "=2.7.1"
ktx2 = "=0.5.0"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "=1.1.11"

[[bin]]
name = "openmars-engine-assets"
path = "src/main.rs"
